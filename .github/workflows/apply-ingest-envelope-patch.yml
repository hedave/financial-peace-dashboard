name: apply-ingest-envelope-patch
on:
  push:
    branches:
      - fix/ingest-apply-envelope
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply engine patch
        run: |
          set -euo pipefail
          if [ ! -f patches/p00.b64 ]; then
            echo "No patch chunks; nothing to do"
            exit 0
          fi
          cat patches/p00.b64 patches/p01.b64 patches/p02.b64 patches/p03.b64 patches/p04.b64 | base64 -d > /tmp/ingest.patch
          git apply --whitespace=nowarn /tmp/ingest.patch
          rm -rf patches
          rm -f .github/workflows/apply-ingest-envelope-patch.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Apply ingest envelope/category on new rows only"
          git push
